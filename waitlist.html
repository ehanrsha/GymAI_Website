<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymAI — Join the waitlist.</title>
<meta name="description" content="Join the GymAI waitlist and be first to know when every workout machine gets smart.">
<meta name="theme-color" content="#dacec2">
<meta name="robots" content="noindex">

<meta property="og:title" content="GymAI — Join the waitlist.">
<meta property="og:description" content="Making every workout machine smart.">
<meta property="og:type" content="website">

<link rel="icon" href="Assets/gymai_logo_transparent_v02_8.17.2026.PNG">
<link rel="preload" href="Fonts/Switzer-Light.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="Fonts/Switzer-Semibold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">

    <img class="squares squares-tl" src="Assets/squares.png" alt="" aria-hidden="true">
    <img class="squares squares-br" src="Assets/squares.png" alt="" aria-hidden="true">

    <div class="panel">

      <a href="index.html" aria-label="Back to the GymAI home page">
        <img class="panel-logo"
             src="Assets/gymai_logo_transparent_v02_8.17.2026.PNG"
             alt="GymAI">
      </a>

      <h1 class="panel-title">Join the <strong>waitlist</strong>.</h1>

      <p class="panel-sub">
        Drop your email and we'll tell you the moment GymAI is ready to
        walk into your gym with you.
      </p>

      <!-- novalidate: the browser's own bubble is suppressed so the .status
           line below carries every message in one consistent place. -->
      <form class="form" id="waitlist-form" novalidate>

        <!-- Bot trap: hidden from people, irresistible to naive scrapers. A
             filled value is discarded silently on the server. -->
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">

        <label class="hp" for="email">Email address</label>
        <input class="field"
               id="email"
               name="email"
               type="email"
               inputmode="email"
               autocomplete="email"
               autocapitalize="off"
               spellcheck="false"
               placeholder="you@email.com"
               required>

        <button class="submit" id="submit" type="submit">
          <span id="submit-label">Enter</span>
          <span class="cta-dot" aria-hidden="true"></span>
        </button>

        <!-- aria-live so screen readers announce results as they arrive. -->
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

    </div>

  </main>

  <script src="nav.js"></script>
  <script src="config.js"></script>
  <script>
  (function () {
    "use strict";

    var ENDPOINT = (window.GYMAI_WAITLIST_ENDPOINT || "").trim();

    var form = document.getElementById("waitlist-form");
    var email = document.getElementById("email");
    var button = document.getElementById("submit");
    var label = document.getElementById("submit-label");
    var status = document.getElementById("status");

    function say(message, state) {
      status.textContent = message;
      if (state) {
        status.setAttribute("data-state", state);
      } else {
        status.removeAttribute("data-state");
      }
    }

    function busy(isBusy) {
      button.disabled = isBusy;
      label.textContent = isBusy ? "Sending" : "Enter";
    }

    // Deliberately loose. Real validation is the confirmation email; the only
    // job here is to catch typos like a missing @ before a round trip.
    function looksLikeEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      var value = email.value.trim();

      if (!looksLikeEmail(value)) {
        say("That email doesn't look right — mind checking it?", "error");
        email.focus();
        return;
      }

      if (!ENDPOINT) {
        say("Sign-ups aren't connected yet. Add your Google Sheet URL to config.js.", "error");
        return;
      }

      busy(true);
      say("");

      // URLSearchParams keeps this a "simple" request, so the browser sends it
      // without a CORS preflight — Apps Script cannot answer an OPTIONS call.
      var body = new URLSearchParams({
        email: value,
        company: form.company.value,
        source: "waitlist.html",
        ref: document.referrer || ""
      });

      fetch(ENDPOINT, { method: "POST", body: body })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data && data.result === "success") {
            done();
          } else {
            throw new Error((data && data.message) || "Unexpected response");
          }
        })
        .catch(function () {
          // The response could not be read — usually a CORS quirk on the
          // redirect Apps Script issues, not a failure to save. Re-send in
          // opaque mode so the row is definitely written, then continue.
          return fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: body })
            .then(done)
            .catch(function () {
              busy(false);
              say("Something went wrong on our end. Please try again.", "error");
            });
        });

      function done() {
        // Survives the redirect so the thank-you page can greet them by name.
        try { sessionStorage.setItem("gymai-waitlist-email", value); } catch (e) {}
        window.location.href = "thanks.html";
      }
    });
  })();
  </script>

</body>
</html>
