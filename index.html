<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymAI — Making every workout machine smart.</title>
<meta name="description" content="GymAI is making every workout machine smart. Join the waitlist.">
<meta name="theme-color" content="#dacec2">

<meta property="og:title" content="GymAI">
<meta property="og:description" content="Making every workout machine smart.">
<meta property="og:type" content="website">

<link rel="icon" href="Assets/gymai_logo_transparent_v02_8.17.2026.PNG">
<link rel="preload" href="Fonts/Switzer-Light.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="Fonts/Switzer-Semibold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="stage">

    <!-- Corner grid motifs. Bottom layer, so on mobile the phone tucks in front
         of the bottom-right one rather than being drawn over. Top-left is the
         same asset rotated 90deg clockwise. -->
    <img class="squares squares-tl" src="Assets/squares.png" alt="" aria-hidden="true">
    <img class="squares squares-br" src="Assets/squares.png" alt="" aria-hidden="true">

    <!-- Logo — desktop: 288px @ y119, centered · mobile: 204px @ y102, centered -->
    <img class="logo"
         src="Assets/gymai_logo_transparent_v02_8.17.2026.PNG"
         alt="GymAI">

    <!-- Phone mockup. The PNG has a transparent screen aperture; .phone-screen sits
         behind it and is where the product video goes. -->
    <div class="phone">
      <div class="phone-screen">
        <!-- App homescreen. The source is 1720x3728 (0.4614) against a 0.4600
             aperture, so `cover` fills it with a sub-pixel crop at any size. -->
        <img class="phone-shot"
             src="Assets/GymAI%20Homescreen%20v2.png"
             alt="The GymAI app homescreen: Research, Settings, Your Gym and Scan.">

        <!-- PRODUCT VIDEO — drop the file in Assets/, uncomment, and delete the
             .phone-shot image above.
        <video class="phone-video"
               autoplay muted loop playsinline
               preload="metadata"
               poster="Assets/product-poster.jpg">
          <source src="Assets/product.webm" type="video/webm">
          <source src="Assets/product.mp4"  type="video/mp4">
        </video>
        -->
      </div>
      <img class="phone-frame"
           src="Assets/iPhone%2017%20Pro%20Silver%20(2).png"
           alt=""
           aria-hidden="true">
    </div>

    <!-- Copy + CTA. Desktop: bottom-left, 32px. Mobile: tagline centered under the
         logo at 16px, CTA pinned to the bottom-left. -->
    <p class="tagline">Making every workout machine <strong>smart</strong>.</p>

    <a class="cta" href="waitlist.html">
      <span class="cta-label">Join The Waitlist</span>
      <span class="cta-dot" aria-hidden="true"></span>
    </a>

  </main>

  <script src="nav.js"></script>

</body>
</html>
